<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sin conexión — Nítido</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f8fafc;
            color: #134a44;
            text-align: center;
            padding: 2rem;
        }
        .badge {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: #158c78;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        h1 { font-size: 1.25rem; margin: 0; }
        p { margin: 0; color: #486a65; max-width: 26rem; }
        button {
            margin-top: 0.5rem;
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 0.5rem;
            background: #158c78;
            color: white;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="badge">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="white">
            <polygon points="14,2 15.56,8.44 22,10 15.56,11.56 14,18 12.44,11.56 6,10 12.44,8.44" />
            <polygon points="6,14.8 6.636,17.364 9.2,18 6.636,18.636 6,21.2 5.364,18.636 2.8,18 5.364,17.364" />
        </svg>
    </div>
    <h1>Sin conexión a internet</h1>
    <p>No se ha podido cargar la página. Comprueba tu conexión y vuelve a intentarlo.</p>
    <button onclick="location.reload()">Reintentar</button>
</body>
</html>
